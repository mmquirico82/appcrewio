<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCrewIO - On-Demand Labor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            background: #131b2e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 {
            color: #ccff00; /* Giallo fosforescente */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #a0aec0;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #1e293b;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>appcrewio</h1>
        <p>Piattaforma per lavoro on-demand con tempi di risposta da 5 a 10 minuti.</p>
        <div class="badge">Up Review Entity</div>
    </div>
</body>
</html>
